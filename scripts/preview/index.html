<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AXXA preview</title>
    <script src="lucide.js"></script>
    <!-- CSS REAL do Obsidian (extraído de obsidian.asar). Tem que vir antes do
         nosso styles.css, como acontece no app: o plugin carrega depois. -->
    <link rel="stylesheet" href="app.css" />
    <link rel="stylesheet" href="main.css" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
      }
      /* Estrutura mínima do workspace pra .view-content receber o mesmo
         tratamento que recebe dentro do app. */
      /* A gaveta, os containers e a leaf são estilizados pelo app.css REAL
         (position: fixed, top/bottom 0, largura parcial). Aqui só o mínimo
         que o app monta via JS: as caixas em coluna. */
      .workspace-drawer,
      .workspace-drawer-active-tab-container,
      .workspace-drawer-active-tab-content,
      .workspace-tab-container,
      .preview-plain-chain,
      .workspace-leaf,
      .workspace-leaf-content {
        display: flex;
        flex-direction: column;
        min-height: 0;
      }
      .workspace-drawer-active-tab-container,
      .workspace-drawer-active-tab-content,
      .workspace-tab-container,
      .preview-plain-chain,
      .workspace-leaf,
      .workspace-leaf-content {
        flex: 1 1 auto;
      }
      .workspace-drawer-header,
      .view-header {
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        padding: 8px 12px;
        background: var(--background-secondary);
        border-bottom: 1px solid var(--background-modifier-border);
        color: var(--text-muted);
        font-size: 13px;
      }
      /* O "editor atrás": é ele que aparece quando a gaveta não cobre a tela. */
      #behind {
        position: fixed;
        inset: 0;
        z-index: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--background-primary-alt, #111);
        color: var(--text-faint);
        font-size: 13px;
      }
      i[data-lucide] {
        display: inline-flex;
      }
      svg.lucide {
        width: 18px;
        height: 18px;
      }
      /* Desenho da navbar/teclado só pro preview. */
      .mobile-navbar {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        height: var(--navbar-height, 48px);
        background: var(--background-secondary);
        border-top: 1px solid var(--background-modifier-border);
        margin-bottom: calc(0px - var(--keyboard-height));
      }
      body.preview-kb::after {
        content: "teclado";
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        height: var(--keyboard-height);
        background: repeating-linear-gradient(
          45deg,
          #2a2a2a,
          #2a2a2a 10px,
          #333 10px,
          #333 20px
        );
        color: #888;
        font-size: 12px;
      }
      body.preview-kb .app-container {
        max-height: calc(100vh - var(--keyboard-height));
      }
      .preview-menu {
        position: fixed;
        z-index: 99;
        display: flex;
        flex-direction: column;
        min-width: 180px;
        padding: 4px;
        border: 1px solid var(--background-modifier-border);
        border-radius: 10px;
        background: var(--background-secondary);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      }
      .preview-menu button {
        padding: 8px 10px;
        background: transparent;
        box-shadow: none;
        text-align: left;
        font-size: 13px;
      }
    </style>
  </head>
  <body class="theme-dark is-mobile is-phone">
    <!-- Mesma árvore do mobile: a AXXA mora na gaveta DIREITA, dentro da aba
         ativa. É o que o CSS de fullscreen/teclado ancora. -->
    <div id="behind">editor por tras (workspace)</div>
    <div class="app-container">
      <div class="workspace-drawer mod-right" id="drawer">
        <div class="workspace-drawer-header">
          <div class="workspace-drawer-header-name">AXXA OS</div>
        </div>
        <div class="workspace-drawer-active-tab-container">
          <div class="workspace-drawer-active-tab-content">
            <!-- `.workspace-tab-container` existia na cadeia da casca antiga,
                 mas pode não existir na versão atual do Obsidian: o parâmetro
                 &chain=short tira o elo pra provar que nada depende dele. -->
            <div class="__TAB_CONTAINER__">
            <div class="workspace-leaf">
              <div
                class="workspace-leaf-content"
                data-type="axxa-os-ai-agent"
                data-mode="preview"
              >
                <div class="view-header"><span>AXXA OS</span></div>
                <div class="view-content" id="app"></div>
              </div>
            </div>
            </div>
          </div>
        </div>
      </div>
      <!-- navbar nativa: exercita a reserva de espaço do composer
           (`:has(.mobile-navbar)`), o recuo com o teclado e o fullscreen. -->
      <div class="mobile-navbar"></div>
    </div>
    <script>
      // ?chain=short remove o elo .workspace-tab-container da árvore.
      (function () {
        const short = new URLSearchParams(location.search).get("chain") === "short";
        const el = document.querySelector(".__TAB_CONTAINER__");
        if (el) el.className = short ? "preview-plain-chain" : "workspace-tab-container";
      })();
      // Tema e modo pela query: ?theme=light&device=desktop
      const q = new URLSearchParams(location.search);
      if (q.get("theme") === "light") {
        document.body.classList.replace("theme-dark", "theme-light");
      }
      if (q.get("device") === "desktop") {
        // `is-phone` anda junto com `is-mobile` no celular de verdade, e é ELA
        // que o app.css usa nas regras mais agressivas de settings
        // (`.is-phone .modal … button { width: 100% }`). Sem ela o preview
        // mostrava um layout que o aparelho nunca teve.
        document.body.classList.remove("is-mobile", "is-phone");
      }
      // ?mic=fake troca o microfone por um oscilador: MediaRecorder e
      // AnalyserNode passam a ver um stream DE VERDADE (chunks reais, nível
      // real), sem depender de permissão nem de hardware. É o único jeito de
      // exercitar o modo de voz aqui — a rede continua falsa no stub.
      if (q.get("mic") === "fake") {
        navigator.mediaDevices = navigator.mediaDevices || {};
        // Um contexto só: o navegador limita quantos AudioContext uma página
        // pode abrir, e um por gravação esgotava depois de algumas.
        let fakeCtx = null;
        // Toda faixa entregue fica aqui: é assim que o teste PROVA que o
        // microfone foi liberado (track.readyState === "ended").
        window.__fakeTracks = [];
        // ?micdelay=700 imita o celular: abrir o microfone LEVA TEMPO (permissão
        // + warm-up). Com o microfone instantâneo do desktop, a corrida entre
        // soltar o dedo e o stream ficar pronto nunca aparecia.
        const micDelay = Number(q.get("micdelay") ?? 0);
        navigator.mediaDevices.getUserMedia = async () => {
          if (micDelay) await new Promise((r) => setTimeout(r, micDelay));
          fakeCtx = fakeCtx || new AudioContext();
          const dest = fakeCtx.createMediaStreamDestination();
          const osc = fakeCtx.createOscillator();
          const gain = fakeCtx.createGain();
          osc.frequency.value = 220;
          osc.connect(gain).connect(dest);
          osc.start();
          // Fala TEM pausa. Um tom contínuo escondia metade do modo de voz —
          // é no silêncio que a gravação é cortada em segmentos. Aqui o ganho
          // alterna 3s de fala e 0,7s de pausa, agendado no relógio do áudio
          // (o setInterval do JS derrapa e a pausa saía torta).
          // ?falamos=4000&pausa=900 mexe nos dois; ?tom=continuo volta ao
          // oscilador parado de antes.
          const falaMs = Number(q.get("falamos") ?? 3000);
          const pausaMs = Number(q.get("pausa") ?? 700);
          if (q.get("tom") === "continuo") {
            gain.gain.value = 0.3;
          } else {
            const t0 = fakeCtx.currentTime;
            const ciclo = (falaMs + pausaMs) / 1000;
            gain.gain.setValueAtTime(0.3, t0);
            for (let k = 0; k < 120; k++) {
              const inicio = t0 + k * ciclo;
              gain.gain.setValueAtTime(0.3, inicio);
              gain.gain.setValueAtTime(0.0001, inicio + falaMs / 1000);
            }
          }
          window.__fakeTracks.push(...dest.stream.getTracks());
          return dest.stream;
        };
      }
      // ?kb=300 simula o teclado: é a MESMA variável que o Obsidian mantém.
      const kb = Number(q.get("kb") ?? 0);
      document.documentElement.style.setProperty("--keyboard-height", kb + "px");
      document.body.classList.toggle("preview-kb", kb > 0);
      // As classes abaixo são as MESMAS que a AxxaView põe nos ancestrais
      // (applyFullscreen / observer do teclado). Aqui elas entram na mão
      // porque o preview renderiza <App> direto, sem a ItemView.
      const drawer = document.getElementById("drawer");
      drawer.classList.toggle("axxa-keyboard-open", kb > 0);
      document.body.classList.toggle("axxa-keyboard-open", kb > 0);
      // Altura útil MEDIDA, como a AxxaView faz com visualViewport.height —
      // e recalculada no resize, também como ela. (No aparelho o valor vem do
      // viewport; aqui é derivado do ?kb=.)
      // Espelha o comportamento REAL do Obsidian mobile (docs/archive/
      // MOBILE-FULLSCREEN.md, 0.1.255): quando o teclado abre, o PRÓPRIO app
      // encolhe a gaveta até o topo do teclado. O plugin não mexe nisso — só
      // o fullscreen, que impõe altura própria, desconta a var.
      // Dois mundos, escolhidos por &webview=resize :
      //  - padrão: o teclado só COBRE. O Obsidian encolhe a gaveta (é o que
      //    mantém o modo normal certo) e, no fullscreen, a altura é nossa —
      //    o CSS desconta a --keyboard-height que o próprio Obsidian publica.
      //  - resize: a WebView encolheu sozinha; não há nada a descontar.
      // Modelo da 0.2.37: quando o teclado abre, o PRÓPRIO Obsidian encolhe a
      // gaveta e marca `is-hidden-nav` (some a navbar). O plugin só reage por
      // classe. `&drawer=fixed` simula uma versão que não encolhe.
      const drawerFixed = q.get("drawer") === "fixed";
      const syncKb = () => {
        drawer.style.height =
          kb > 0 && !drawerFixed ? window.innerHeight - kb + "px" : "";
      };
      syncKb();
      window.addEventListener("resize", syncKb);
      window.visualViewport?.addEventListener("resize", syncKb);
      // `is-hidden-nav` é o que o Obsidian marca quando esconde a navbar —
      // acontece com o teclado aberto. É o gatilho que tira a nossa reserva.
      document.body.classList.toggle("is-hidden-nav", q.get("nav") === "hidden");
      const fs = q.get("fs") === "1";
      drawer.classList.toggle("axxa-fullscreen", fs);
      document.body.classList.toggle("axxa-fullscreen", fs);
      // Extensões de HTMLElement que o Obsidian injeta e o browser não tem.
      HTMLElement.prototype.empty = function () {
        while (this.firstChild) this.removeChild(this.firstChild);
      };
      HTMLElement.prototype.createEl = function (tag, o) {
        const el = document.createElement(tag);
        if (o && o.text) el.textContent = o.text;
        if (o && o.cls) el.className = o.cls;
        this.appendChild(el);
        return el;
      };
      HTMLElement.prototype.createDiv = function (o) {
        return this.createEl("div", typeof o === "string" ? { cls: o } : o);
      };
      HTMLElement.prototype.createSpan = function (o) {
        return this.createEl("span", typeof o === "string" ? { cls: o } : o);
      };
      HTMLElement.prototype.addClass = function (...c) {
        this.classList.add(...c);
      };
      HTMLElement.prototype.removeClass = function (...c) {
        this.classList.remove(...c);
      };
      HTMLElement.prototype.toggleClass = function (c, v) {
        this.classList.toggle(c, v);
      };
      HTMLElement.prototype.setText = function (t) {
        this.textContent = t;
      };
    </script>
    <script src="bundle.js"></script>
    <script>
      setTimeout(
        () => window.lucide?.createIcons({ nameAttr: "data-lucide" }),
        60
      );
    </script>
  </body>
</html>
